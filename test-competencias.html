          </div>

              <div class="text-center">

                <div class="text-sm text-slate-500 mt-2">de 200 puntos</div>
              </div>
              <div id="decisionBadge" class="mt-4 px-4 py-2 rounded-full text-center font-semibold bg-slate-100 text-slate-500">
                Sin evaluar

            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-6">
              <h3 class="text-lg font-semibold text-slate-900 mb-4">Perfil de Competencias</h3>

      ],

      ],
      "Resiliencia": [
        {texto: "Fallas en un proyecto importante frente a todos. ¿Cómo reaccionas?", opciones: [{texto: "Asumo responsabilidad, aprendo y me enfoco en la próxima oportunidad", puntos: 5}, {texto: "Me siento avergonzado y evito a la gente por un tiempo", puntos: 2}, {texto: "Culpo a factores externos para no sentirme mal", puntos: 1}, {texto: "Me quejo de que no me dieron las herramientas necesarias", puntos: 3}]},
        {texto: "Recibes múltiples rechazos en tu área de trabajo. ¿Qué haces?", opciones: [{texto: "Analizo feedback, ajusto enfoque y sigo intentando", puntos: 5}, {texto: "Me desanimo y considero cambiar de área", puntos: 2}, {texto: "Insisto con el mismo enfoque, eventualmente funcionará", puntos: 3}, {texto: "Dejo de intentarlo, claramente no es para mí", puntos: 1}]},
        {texto: "Cambian las reglas del juego en medio de un proyecto importante. ¿Qué haces?", opciones: [{texto: "Me adapto rápidamente, reevalúo y ajusto el plan", puntos: 5}, {texto: "Me frustro pero sigo adelante", puntos: 3}, {texto: "Me quejo del cambio y sigo con el plan original", puntos: 1}, {texto: "Abandono el proyecto, ya no tiene sentido", puntos: 2}]},
        {texto: "Tienes un día terrible en el trabajo. ¿Cómo lo manejas?", opciones: [{texto: "Desconecto al salir, descanso y mañana será otro día", puntos: 5}, {texto: "Me llevo el estrés a casa y no puedo dormir", puntos: 2}, {texto: "Salgo a desahogarme con amigos o familia", puntos: 3}, {texto: "Sigo trabajando aunque me sienta mal", puntos: 1}]}
      ]
    };

    // ========================================
    // VARIABLES GLOBALES
    // ========================================
    let respuestas = {};
    let competenciasActuales = [];
    let preguntasAleatorias = {};
    let radarChart = null;

    // ========================================
    // FUNCIONES PRINCIPALES
    // ========================================
    function init() {
      populateCargoSelect();
      setupEventListeners();
      initRadarChart();
    }

    function populateCargoSelect() {
      const select = document.getElementById('cargoSelect');
      Object.keys(cargos).sort().forEach(cargo => {
        const option = document.createElement('option');
        option.value = cargo;
        option.textContent = cargo;
        select.appendChild(option);
      });
    }

    function setupEventListeners() {
      document.getElementById('cargoSelect').addEventListener('change', handleCargoChange);
      document.getElementById('candidateName').addEventListener('input', validateForm);
    }

    function handleCargoChange(e) {
      const cargo = e.target.value;
      if (!cargo) return;

      competenciasActuales = cargos[cargo];
      respuestas = {};
      preguntasAleatorias = {};

      // Aleatorizar preguntas por competencia
      competenciasActuales.forEach(comp => {
        const preguntas = [...bancoPreguntas[comp]];
        preguntasAleatorias[comp] = shuffleArray(preguntas);
      });

      renderQuestions();
      updateScore();
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      competenciasActuales.forEach((competencia, compIndex) => {
        const section = document.createElement('div');
        section.className = 'bg-white rounded-xl border border-slate-200 p-6 mb-6';
        
        const header = document.createElement('div');
        header.className = 'flex items-center gap-3 mb-4';
        header.innerHTML = `
          <div class="w-10 h-10 rounded-lg bg-emerald-100 flex items-center justify-center">
            <span class="text-emerald-600 font-bold">${compIndex + 1}</span>
          </div>
          <h2 class="text-lg font-semibold text-slate-900">${competencia}</h2>
        `;
        section.appendChild(header);

        const questionsDiv = document.createElement('div');
        questionsDiv.className = 'space-y-6';

        preguntasAleatorias[competencia].forEach((pregunta, qIndex) => {
          const questionBlock = document.createElement('div');
          questionBlock.className = 'border-l-4 border-slate-200 pl-4';
          
          const questionText = document.createElement('p');
          questionText.className = 'text-slate-700 font-medium mb-3';
          questionText.textContent = `${qIndex + 1}. ${pregunta.texto}`;
          questionBlock.appendChild(questionText);

          const optionsDiv = document.createElement('div');
          optionsDiv.className = 'space-y-2';

          pregunta.opciones.forEach((opcion, oIndex) => {
            const optionLabel = document.createElement('label');
            optionLabel.className = 'flex items-start gap-3 p-3 rounded-lg hover:bg-slate-50 cursor-pointer transition-colors';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = `q_${competencia}_${qIndex}`;
            radio.value = oIndex;
            radio.className = 'mt-1';
            radio.addEventListener('change', () => handleAnswer(competencia, qIndex, oIndex, opcion.puntos));
            
            const text = document.createElement('span');
            text.className = 'text-slate-600';
            text.textContent = opcion.texto;
            
            optionLabel.appendChild(radio);
            optionLabel.appendChild(text);
            optionsDiv.appendChild(optionLabel);
          });

          questionBlock.appendChild(optionsDiv);
          questionsDiv.appendChild(questionBlock);
        });

        section.appendChild(questionsDiv);
        container.appendChild(section);
      });
    }

    function handleAnswer(competencia, questionIndex, optionIndex, puntos) {
      if (!respuestas[competencia]) {
        respuestas[competencia] = {};
      }
      respuestas[competencia][questionIndex] = puntos;
      updateScore();
    }

    function updateScore() {
      let totalScore = 0;
      let competenciaScores = {};
      let competenciasRespondidas = 0;

      competenciasActuales.forEach(comp => {
        if (respuestas[comp]) {
          const puntos = Object.values(respuestas[comp]);
          const promedio = puntos.reduce((a, b) => a + b, 0) / puntos.length;
          competenciaScores[comp] = promedio;
          totalScore += promedio * 4; // Factor de 4 preguntas
          competenciasRespondidas++;
        }
      });

      // Actualizar puntaje total
      document.getElementById('totalScore').textContent = Math.round(totalScore);
      document.getElementById('totalScore').className = 'text-5xl font-bold ' + getScoreColor(totalScore);

      // Actualizar badge de decisión
      updateDecisionBadge(totalScore, competenciaScores);

      // Actualizar radar chart
      updateRadarChart(competenciaScores);

      // Actualizar desglose
      updateCompetencyBreakdown(competenciaScores);
    }

    function getScoreColor(score) {
      if (score >= 170) return 'text-emerald-600';
      if (score >= 140) return 'text-blue-600';
      return 'text-slate-400';
    }

    function updateDecisionBadge(totalScore, competenciaScores) {
      const badge = document.getElementById('decisionBadge');
      
      // Verificar red flags
      const redFlags = ['Ética', 'Integridad', 'Confidencialidad'];
      const hasRedFlag = redFlags.some(comp => 
        competenciaScores[comp] && competenciaScores[comp] <= 2
      );

      if (hasRedFlag) {
        badge.textContent = 'DESCARTADO POR VALORES';
        badge.className = 'mt-4 px-4 py-2 rounded-full text-center font-semibold bg-red-100 text-red-700';
      } else if (totalScore >= 170) {
        badge.textContent = 'SOBRESALIENTE';
        badge.className = 'mt-4 px-4 py-2 rounded-full text-center font-semibold bg-emerald-100 text-emerald-700';
      } else if (totalScore >= 140) {
        badge.textContent = 'APTO';
        badge.className = 'mt-4 px-4 py-2 rounded-full text-center font-semibold bg-blue-100 text-blue-700';
      } else if (totalScore > 0) {
        badge.textContent = 'NO APTO';
        badge.className = 'mt-4 px-4 py-2 rounded-full text-center font-semibold bg-slate-100 text-slate-600';
      } else {
        badge.textContent = 'Sin evaluar';
        badge.className = 'mt-4 px-4 py-2 rounded-full text-center font-semibold bg-slate-100 text-slate-500';
      }
    }

    function initRadarChart() {
      const ctx = document.getElementById('radarChart').getContext('2d');
      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: [],
          datasets: [{
            label: 'Nivel de Competencia',
            data: [],
            backgroundColor: 'rgba(16, 185, 129, 0.2)',
            borderColor: 'rgb(16, 185, 129)',
            pointBackgroundColor: 'rgb(16, 185, 129)',
            pointBorderColor: '#fff',
            pointHoverBackgroundColor: '#fff',
            pointHoverBorderColor: 'rgb(16, 185, 129)'
          }]
        },
        options: {
          responsive: true,
          scales: {
            r: {
              beginAtZero: true,
              max: 5,
              ticks: {
                stepSize: 1,
                font: {
                  family: 'Plus Jakarta Sans'
                }
              },
              pointLabels: {
                font: {
                  family: 'Plus Jakarta Sans',
                  size: 11
                }
              }
            }
          },
          plugins: {
            legend: {
              display: false
            }
          }
        }
      });
    }

    function updateRadarChart(competenciaScores) {
      if (!radarChart) return;

      const labels = Object.keys(competenciaScores);
      const data = Object.values(competenciaScores);

      radarChart.data.labels = labels;
      radarChart.data.datasets[0].data = data;
      radarChart.update();
    }

    function updateCompetencyBreakdown(competenciaScores) {
      const container = document.getElementById('competencyBreakdown');
      container.innerHTML = '';

      competenciasActuales.forEach(comp => {
        const score = competenciaScores[comp];
        if (score === undefined) return;

        const row = document.createElement('div');
        row.className = 'flex items-center justify-between';

        const label = document.createElement('span');
        label.className = 'text-sm text-slate-600';
        label.textContent = comp;

        const value = document.createElement('span');
        value.className = 'text-sm font-semibold ' + getCompetencyColor(score);
        value.textContent = score.toFixed(1);

        row.appendChild(label);
        row.appendChild(value);
        container.appendChild(row);
      });
    }

    function getCompetencyColor(score) {
      if (score >= 4) return 'text-emerald-600';
      if (score >= 3) return 'text-blue-600';
      if (score >= 2) return 'text-amber-600';
      return 'text-red-600';
    }

    function validateForm() {
      // Validación simple
      const name = document.getElementById('candidateName').value.trim();
      const cargo = document.getElementById('cargoSelect').value;
      return name && cargo;
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', init);
  </script>
